<label for='sidenote-id' class='margin-toggle sidenote-number'></label><input type='checkbox' id='sidenote-id' class='margin-toggle'/><span class='sidenote'>{{ include.text }} </span>{%- comment -%}Keep this file on a single line with NO trailing newline: the include is used mid-sentence/mid-list-item, and a trailing newline yields a blank line that makes kramdown split the surrounding paragraph or turn the list item into a loose <p>.{%- endcomment -%}
